name: GMO FX Data Pipeline

on:
  workflow_dispatch:

concurrency:
  group: gmo-fx-data-pipeline
  cancel-in-progress: true

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DISCORD_FOREX_MAIN: ${{ secrets.DISCORD_FOREX_MAIN }}
      DISCORD_FOREX_OTHER: ${{ secrets.DISCORD_FOREX_OTHER }}
      OPENAI_MODEL: gpt-5.6-luna
      OPENAI_MARKET_REASONING_EFFORT: low
      OPENAI_BATCH_ANALYSIS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests "openai==3.2.0"

      - name: Run FX pipeline
        shell: bash
        run: |
          set -euo pipefail

          weekday_jst=$(TZ=Asia/Tokyo date +%u)
          if [[ "$weekday_jst" -gt 5 ]]; then
            echo "FX weekend: pipeline skipped."
            exit 0
          fi

          # データ処理は全銘柄を一括実行。
          python fetch_gmo_ohlcv.py symbols.csv
          python ohlcv_calc.py symbols.csv
          python prepare_features.py symbols.csv

          # Stage1を全銘柄に適用後、通過銘柄だけを1回のOpenAI APIで一括分析。
          python notify_discord_all.py --symbols_file symbols.csv
